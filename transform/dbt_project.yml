name: "carrefour"
version: "1.0.0"
config-version: 2

profile: "carrefour"

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# The fidélité match threshold is env-driven (config.FIDELITY_MATCH_THRESHOLD),
# read by the int_loyalty_matched Python model — dbt vars aren't visible there.

models:
  carrefour:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
