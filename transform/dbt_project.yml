name: "carrefour"
version: "1.0.0"
config-version: 2

profile: "carrefour"

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# The fidélité match threshold is env-driven (config.FIDELITY_MATCH_THRESHOLD),
# read by the int_loyalty_matched Python model — dbt vars aren't visible there.

seeds:
  carrefour:
    +schema: seeds

models:
  carrefour:
    # Propagate model/column descriptions into DuckDB as comments so the catalog
    # is documented at the database level too (independent of any README).
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      analytics:
        +materialized: table
