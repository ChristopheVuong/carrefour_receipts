version: 2

models:
  - name: dim_date
    description: "Date dimension derived from observed receipt dates."
    columns:
      - name: date_day
        tests: [not_null, unique]

  - name: fct_receipts
    description: "One row per receipt with totals and payment-method breakdown."
    columns:
      - name: receipt_id
        tests: [not_null, unique]
      - name: receipt_date
        tests: [not_null]
      - name: total_paid
        tests: [not_null]

  - name: fct_receipt_lines
    description: "One row per receipt line item, with net price and product categorization."
    columns:
      - name: receipt_id
        description: "FK to fct_receipts."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_receipts')
                field: receipt_id
      - name: vat_category
        description: "Binary VAT heuristic (food when VAT 5.5/10, else other) — always populated; the fallback for `category`."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["food", "other"]
      - name: category
        description: "Keyword-classified category (int_product_categorized), falling back to vat_category below the similarity threshold."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["food", "hygiene_beauty", "household", "other"]
      - name: subcategory
        description: "Finer classification (e.g. fruit, dairy, dishwashing); NULL when the label was not confidently matched."
      - name: category_confidence
        description: "Similarity [0, 1] of the keyword match behind `category` (0 when it fell back to vat_category)."
        tests: [not_null]
      - name: total_price
        tests: [not_null]

  - name: fct_orders
    description: "One row per Drive order with totals and payment-method breakdown (the Drive equivalent of fct_receipts)."
    columns:
      - name: order_number
        tests: [not_null, unique]
      - name: order_date
        tests: [not_null]
      - name: total_paid
        tests: [not_null]

  - name: fct_order_lines
    description: "One row per Drive order line item, with net price and product categorization (the Drive equivalent of fct_receipt_lines)."
    columns:
      - name: order_line_id
        description: "Unique line key (order_number + order_line_index)."
        tests: [not_null, unique]
      - name: order_number
        description: "FK to fct_orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_number
      - name: category
        description: "Keyword-classified category; falls back to 'other' (orders have no per-line VAT)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["food", "hygiene_beauty", "household", "other"]
      - name: total_price
        tests: [not_null]

  - name: fct_loyalty_lines
    description: "One row per loyalty (fidélité) line, one-to-one matched to a receipt product line."
    columns:
      - name: loyalty_line_id
        description: "Unique key for the loyalty line."
        tests: [not_null, unique]
      - name: loyalty_date
        tests: [not_null]
      - name: matched_line_id
        description: >
          Receipt line (stg_receipt_lines.line_dlt_key) this loyalty line is matched
          to; NULL when unmatched. The `unique` test (NULLs ignored) enforces the
          one-to-one guarantee: each receipt line is claimed by at most one loyalty line.
        tests:
          - unique
      - name: is_matched
        description: "Whether the loyalty label matched a receipt product above the threshold."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
