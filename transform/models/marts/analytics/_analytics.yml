version: 2

models:
  - name: dim_month_spine
    description: '{{ doc("month_spine") }}'
    columns:
      - name: month_start
        description: "First day of the month (date)."
        tests: [not_null, unique]
      - name: year_month
        description: "Month as YYYY-MM (join key for the time-series marts)."
        tests: [not_null, unique]

  - name: mart_monthly_spend
    description: >
      Monthly spend KPIs: total paid, immediate discount and receipt count, with
      rolling 3/6/12-month averages and year-over-year deltas. One row per month.
    columns:
      - name: year_month
        tests: [not_null, unique]
      - name: total_paid
        description: "Sum of receipt totals for the month (0 when no shopping)."
        tests: [not_null]
      - name: total_paid_roll_3m
        description: "Trailing 3-month average of total_paid (partial at the series start)."
      - name: yoy_pct
        description: "Year-over-year change in total_paid; NULL until 13+ months of history."

  - name: mart_category_insights
    description: >
      Monthly spend by category with bio, non-food (VAT 20%) and meat-vs-plant
      breakdowns. One row per (year_month, category).
    columns:
      - name: year_month
        tests: [not_null]
      - name: category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["food", "hygiene_beauty", "household", "other"]
      - name: spend
        description: "Net spend (after immediate discount) for the category that month."
        tests: [not_null]

  - name: mart_product_prices
    description: >
      Per-product monthly average unit price for price-trend analysis, with flags
      for frequently bought products and staple food baskets. One row per
      (product_label, year_month).
    columns:
      - name: product_label
        tests: [not_null]
      - name: year_month
        tests: [not_null]
      - name: is_top_product
        description: "True when the product's total quantity over the window clears the charting cutoff."
        tests: [not_null]

  - name: mart_quantities
    description: >
      Monthly quantity KPIs: fruit/veg kilograms, total items, and rolling hygiene /
      detergent consumption. One row per month (over the spine).
    columns:
      - name: year_month
        tests: [not_null, unique]
      - name: total_items
        description: "Total item quantity bought in the month (0 when no shopping)."
        tests: [not_null]
