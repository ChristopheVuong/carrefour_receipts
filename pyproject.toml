[project]
name = "carrefour_receipts_api"
version = "0.1.0"
description = "Extract, model and analyze personal Carrefour receipts (modern data stack: dlt + DuckDB + dbt)."
authors = [{ name = "Christophe Vuong", email = "christophe.vuong108@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["retail", "shopping", "e-commerce", "analytics", "finance"]

# Core runtime: extraction + tabular analysis. Kept deliberately light so CI
# and the ELT path install fast. Heavy/optional pieces live in the extras below.
dependencies = [
    "httpx>=0.27",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Modern data stack: extract-load (dlt) -> DuckDB -> transform (dbt).
elt = [
    "dlt[duckdb]>=1.5",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
]
# Classic pandas/sklearn analysis + legacy MongoDB path.
analysis = [
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "rapidfuzz>=3.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pymongo>=4.6",
]
# Semantic label matching (pulls torch transitively — keep isolated).
ml = [
    "sentence-transformers>=3.0",
]
# Browser-driven authentication / scraping fallbacks.
scraping = [
    "selenium>=4.20",
    "seleniumbase>=4.27",
    "playwright>=1.44",
]

[dependency-groups]
# `uv sync` installs these by default (dev tooling).
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]

[project.urls]
Repository = "https://github.com/ChristopheVuong/carrefour_receipts"
Documentation = "https://github.com/ChristopheVuong/carrefour_receipts/blob/main/README.md"
"Bug Tracker" = "https://github.com/ChristopheVuong/carrefour_receipts/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carrefour_receipts_api"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "fast: quick tests safe to run everywhere",
    "slow: heavy tests (embeddings, models) — opt in",
    "integration: hits the live Carrefour API; requires local credentials",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Legacy modules carry pre-existing style debt; tighten incrementally.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src/carrefour_receipts_api"]
