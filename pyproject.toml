[project]
name = "carrefour_receipts_api"
version = "0.1.0"
description = "Extract, model and analyze personal Carrefour receipts (modern data stack: dlt + DuckDB + dbt)."
authors = [{ name = "Christophe Vuong", email = "christophe.vuong108@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
keywords = ["retail", "shopping", "e-commerce", "analytics", "finance"]

# Core runtime: extraction + tabular analysis. Kept deliberately light so CI
# and the ELT path install fast. Heavy/optional pieces live in the extras below.
dependencies = [
    "httpx>=0.27",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Modern data stack: extract-load (dlt) -> DuckDB -> transform (dbt).
elt = [
    "dlt[duckdb]>=1.5",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
]
# Pandas/sklearn analysis + the fidélité one-to-one match (rapidfuzz + scipy).
analysis = [
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "rapidfuzz>=3.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
# Semantic label matching via fastembed (ONNX Runtime — no torch, so it installs
# on macOS x86_64/Intel where recent torch has no wheels).
ml = [
    "fastembed>=0.4",
]
# Browser-driven authentication (auth service) + browser-impersonating fetch.
# patchright is a drop-in Playwright fork that hides the CDP Runtime.enable leak
# Cloudflare Turnstile detects; the auth service prefers it when present.
scraping = [
    "playwright>=1.44",
    "patchright>=1.44",
    "curl-cffi>=0.7",
]
# Interactive analytics dashboard over the DuckDB marts (Streamlit + Altair).
dashboard = [
    "streamlit>=1.38",
    "altair>=5.3",
    "duckdb>=1.1",
]
# FastAPI auth service: opens the Carrefour login portal in a browser and
# captures the session cookies (the browser flow also needs the `scraping` extra
# for Playwright).
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
# Convenience aggregate for local development: the full runnable stack (pipeline +
# dashboard + auth service). The heavy/optional extras `scraping` (selenium/
# playwright) and `ml` (fastembed/ONNX) stay opt-in. `make install` uses this; the
# Docker image and CI keep their own lean subsets, so this never bloats them.
all = [
    "carrefour_receipts_api[elt,analysis,dashboard,api]",
]

[dependency-groups]
# `uv sync` installs these by default (dev tooling).
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]

[project.urls]
Repository = "https://github.com/ChristopheVuong/carrefour_receipts"
Documentation = "https://github.com/ChristopheVuong/carrefour_receipts/blob/main/README.md"
"Bug Tracker" = "https://github.com/ChristopheVuong/carrefour_receipts/issues"

[tool.uv]
# onnxruntime (pulled by fastembed, the `ml` extra) only ships macOS x86_64/Intel
# wheels up to 1.23.x; 1.24+ is arm64/Linux/Windows only. Constrain it *just* on
# Intel Macs so the `ml` extra stays installable there — Linux/Apple-Silicon keep
# the latest. fastembed needs onnxruntime>1.21, so this resolves to 1.23.2.
constraint-dependencies = [
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carrefour_receipts_api"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "fast: quick tests safe to run everywhere",
    "slow: heavy tests (embeddings, models) — opt in",
    "integration: hits the live Carrefour API; requires local credentials",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Legacy modules carry pre-existing style debt; tighten incrementally.
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
files = ["src/carrefour_receipts_api"]
