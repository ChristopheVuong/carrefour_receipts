# Pre-commit hooks mirroring the CI quality job.
# Hooks call uv run directly — no make delegation — so they work regardless of
# whether make is in PATH in the pre-commit environment.
#
# ruff format and ruff check --fix mutate files when they find issues; pre-commit
# will abort the commit so you can re-stage the auto-fixed files and retry.
#
# Setup:
#   uv run pre-commit install          # wires both the pre-commit and pre-push stages
# Run manually:
#   uv run pre-commit run --all-files                       # commit-stage hooks
#   uv run pre-commit run --all-files --hook-stage pre-push # also the test hook

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (auto-fix)
        entry: uv run ruff format src
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix src tests
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy (modern stack)
        entry: uv run mypy
          src/carrefour_receipts_api/config.py
          src/carrefour_receipts_api/embeddings.py
          src/carrefour_receipts_api/matching.py
          src/carrefour_receipts_api/categorization.py
          src/carrefour_receipts_api/logging_config.py
          src/carrefour_receipts_api/elt
          src/carrefour_receipts_api/dashboard
          src/carrefour_receipts_api/auth_service
          src/carrefour_receipts_api/assistant
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (offline tests, on push)
        entry: uv run pytest -m "not integration" --cov=carrefour_receipts_api --cov-report=term-missing -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
